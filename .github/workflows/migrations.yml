name: Migrations

# Replaces the "Supabase Preview" check, which never worked: it fired
# only on migration changes and then either 404'd in four seconds
# ("Postgres config not found") or hung forever waiting on a branch
# action, because two stale dashboard integrations were pointed at this
# repo and neither could provision. It never applied a migration, so
# every `supabase/migrations/*.sql` file in this repo has shipped
# unexecuted by CI.
#
# This job does the thing that check only claimed to: boot a clean
# Postgres and replay every migration, in order, from nothing. It needs
# no secrets and no Supabase account — the CLI runs the database in a
# container on the runner.

on:
  pull_request:
    # `supabase/**` rather than `supabase/migrations/**` so a change to
    # config.toml re-runs the check too, and this workflow is listed so
    # that edits to the check are validated by the check.
    #
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned rather than `latest`: this check is infrastructure,
          # and a CLI release changing behaviour should be a deliberate
          # bump in a PR, not a Tuesday where main goes red.
          version: 2.113.0

      - name: Start Postgres
        run: supabase db start

      # `db start` already applies the migrations on a cold volume, but
      # only on a cold volume — it is a no-op against a database that
      # already exists. `db reset` drops and rebuilds unconditionally,
      # so this step, not the one above, is the guarantee that every
      # migration ran in filename order against nothing. It fails on the
      # first statement Postgres rejects. --no-seed because there is no
      # seed script and this is about schema, not data.
      - name: Replay every migration from scratch
        run: supabase db reset --local --no-seed

      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql

      # The schema check asserts shape. This one asserts BEHAVIOUR:
      # it builds a real case and a real completed job and proves the
      # outcome-capture guards actually fire - a labour duration that
      # contradicts its own timestamps is rejected, an AI suggestion
      # cannot be written as a collected amount, a finalized case is
      # frozen, and a case cannot be attached to another account.
      # Without this, every one of those could be dropped from a trigger
      # and CI would stay green.
      - name: Verify the outcome capture guards
        run: supabase db query --local --file supabase/ci/verify-outcome-capture.sql

      # The import check asserts BEHAVIOUR of migration 051: a dry run
      # cannot record a created case, one source record cannot be
      # attributed to two cases, the source ledger is append-only, a
      # finalized case accepts no new imported source, and an
      # imported_historical collected amount still does not earn
      # tier A.
      - name: Verify the historical import guards
        run: supabase db query --local --file supabase/ci/verify-historical-import.sql

      # Migration 052: quote money shape, explicit transitions, immutable
      # revisions/events, idempotency, concurrency backstops and tenant RLS.
      - name: Verify the quote lifecycle guards
        run: supabase db query --local --file supabase/ci/verify-quotes.sql

      # Migration 053: vector memory. Asserts BEHAVIOUR - an unregistered
      # embedding model is rejected, content-hash dedup makes generation
      # idempotent, a case can hold only one current vector per kind,
      # identity and vector values are immutable, excluding a case
      # withholds its vectors and a privileged write cannot reactivate
      # them, deleting a case cascades them away, and RLS holds.
      - name: Verify the vector memory guards
        run: supabase db query --local --file supabase/ci/verify-vector-memory.sql

      # Migration 054: canonical per-image observation persistence.
      # Asserts BEHAVIOUR - the same media under the same model and
      # schema is idempotent while a re-analysis under a different
      # model, schema or prompt is representable, an observation
      # spanning several photographs is stored once with several
      # source links, a caller-supplied media path that is not derived
      # from the source message is refused, an unvalidated run cannot
      # carry an observation, observations are immutable, a priced or
      # weighed payload is refused, excluding a case withholds its
      # analyses, deleting a photograph prunes the observation that
      # lost its last source, and RLS holds.
      - name: Verify the image observation guards
        run: supabase db query --local --file supabase/ci/verify-image-observations.sql
